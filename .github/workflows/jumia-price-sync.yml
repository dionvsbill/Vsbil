name: VSBIL Jumia price sync

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync imported Jumia products
        env:
          VSBIL_URL: ${{ secrets.VSBIL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VSBIL_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$VSBIL_URL/api/cron/sync-jumia-prices"
