<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Verification — VSBIL</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/commerce.css"></head><body><main class="commerce-shell"><section class="commerce-card" style="max-width:620px;margin:80px auto;text-align:center"><p class="eyebrow">VSBIL CHECKOUT</p><h1 id="title">Verifying payment…</h1><p id="message" class="muted">Please wait while the server confirms your Paystack transaction.</p><a id="track" class="primary" href="#" hidden>Track your order</a></section></main><script>const p=new URLSearchParams(location.search),ref=p.get('reference');fetch(`/api/business-commerce/shop-public/checkout/verify?reference=${encodeURIComponent(ref||'')}`).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{document.getElementById('title').textContent=ok?'Payment confirmed':'Payment could not be verified';document.getElementById('message').textContent=d.message||'Please contact support if money was deducted.';if(ok&&d.order?.order_number){const a=document.getElementById('track');a.hidden=false;a.href=`/order-track.html?orderNumber=${encodeURIComponent(d.order.order_number)}`;a.textContent='Track your order';}}).catch(()=>{document.getElementById('title').textContent='Verification unavailable';document.getElementById('message').textContent='We could not reach the payment verification service.'});</script></body></html>
