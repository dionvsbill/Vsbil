<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create and manage funded VSBIL YouTube viewing campaigns."><title>Creator Hub — VSBIL</title><link rel="stylesheet" href="/css/style.css"><style>.page{max-width:1120px;margin:auto;padding:36px 20px 70px}.panel{background:var(--card-bg,#fff);border:1px solid rgba(0,0,0,.08);border-radius:22px;padding:24px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field input,.field select{padding:13px;border-radius:11px;border:1px solid rgba(0,0,0,.14);background:#fff;color:#111827}.full{grid-column:1/-1}.hint{font-size:13px;opacity:.68}.msg{min-height:24px;margin-top:12px}.campaigns{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.campaign{padding:18px;border:1px solid rgba(0,0,0,.08);border-radius:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#eef2f7;color:#111827}@media(max-width:720px){.form-grid,.campaigns{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="page"><a href="/dashboard.html">← Back to dashboard</a><section class="panel"><p class="eyebrow">CREATOR HUB</p><h1>Create a campaign</h1><p>Campaign budgets are reserved from your VSBIL available balance. New campaigns enter admin review before participants can see them.</p><form id="campaignForm"><div class="form-grid"><div class="field"><label for="title">Campaign title</label><input id="title" maxlength="120" required placeholder="Watch my latest video"></div><div class="field"><label for="url">YouTube URL</label><input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label for="reward">Reward per completed view (GH₵)</label><input id="reward" type="number" min="0.10" max="100" step="0.01" value="1.00" required></div><div class="field"><label for="budget">Total campaign budget (GH₵)</label><input id="budget" type="number" min="5" max="100000" step="0.01" value="20.00" required><span class="hint">The full amount is reserved when you submit.</span></div><div class="field"><label for="participants">Maximum participants</label><input id="participants" type="number" min="1" max="1000000" step="1" value="20" required></div><div class="field"><label for="seconds">Minimum viewing time (seconds)</label><input id="seconds" type="number" min="5" max="3600" step="1" value="30" required></div><div class="field full"><label for="startsAt">Start time (optional)</label><input id="startsAt" type="datetime-local"></div><div class="field full"><label for="endsAt">End time (optional)</label><input id="endsAt" type="datetime-local"></div></div><div class="actions"><button class="btn primary" id="submitBtn" type="submit">Submit campaign for review</button></div><div class="msg" id="msg" aria-live="polite"></div></form></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><p class="eyebrow">MY CAMPAIGNS</p><h2>Campaign management</h2></div><button class="btn secondary" id="refresh">Refresh</button></div><div class="campaigns" id="mine"><p>Loading…</p></div></section></main><script src="/js/auth-flow.js"></script><script>
"use strict";const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));const money=v=>`₵${(Number(v||0)/100).toFixed(2)}`;const key=()=>`campaign-${crypto.randomUUID()}`;
async function api(path,opt={}){return VSBIL_AUTH.api(path,opt)}
async function load(){try{const d=await api('/api/activities/mine');$('mine').innerHTML=(d.activities||[]).map(a=>`<article class="campaign"><h3>${esc(a.title)}</h3><span class="badge">${esc(a.status)}</span><p>Reward: ${money(a.reward_amount)} · Budget: ${money(a.budget_amount)} · Reserved: ${money(a.reserved_amount)} · Spent: ${money(a.spent_amount)}</p><p>Participants: ${Number(a.completed_count||0)} / ${Number(a.max_participants||0)}</p>${a.review_note?`<p><strong>Admin note:</strong> ${esc(a.review_note)}</p>`:""}<div class="actions">${a.status==='active'?`<button class="btn secondary" data-pause="${esc(a.id)}">Pause</button>`:""}${['pending','paused'].includes(a.status)?`<button class="btn secondary" data-archive="${esc(a.id)}">Close campaign</button>`:""}</div></article>`).join('')||'<p>No campaigns yet.</p>';document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>change(b.dataset.pause,'paused'));document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>change(b.dataset.archive,'archived'));}catch(e){$('mine').textContent=e.message}}
async function change(id,status){if(!confirm(status==='archived'?'Close this campaign?':'Pause this campaign?'))return;try{await api(`/api/activities/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}
$('campaignForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('msg').textContent='Reserving budget and submitting…';try{const d=await api('/api/activities',{method:'POST',headers:{'X-Idempotency-Key':key()},body:JSON.stringify({title:$('title').value,url:$('url').value,action:'watch',rewardGhs:Number($('reward').value),budgetGhs:Number($('budget').value),maxParticipants:Number($('participants').value),minimumSeconds:Number($('seconds').value),startsAt:$('startsAt').value?new Date($('startsAt').value).toISOString():null,endsAt:$('endsAt').value?new Date($('endsAt').value).toISOString():null})});$('msg').textContent=d.message;e.target.reset();load()}catch(e){$('msg').textContent=e.message}finally{$('submitBtn').disabled=false}});$('refresh').onclick=load;load();
</script></body></html>
