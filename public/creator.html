<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Hub — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><style>.page{max-width:1100px;margin:auto;padding:40px 20px}.panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:25px;margin:20px 0}.form-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field input,.field select{padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:#0d1220;color:#fff}.campaigns{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.campaign{padding:20px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(255,255,255,.025)}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#aeb7ce;font-size:13px}.msg{min-height:22px;margin-top:10px;color:#b8c2d9}@media(max-width:700px){.form-grid,.campaigns{grid-template-columns:1fr}}</style></head><body class="dashboard-page"><main class="dashboard-main"><div class="page"><a class="muted" href="/dashboard.html">← Back to dashboard</a><div class="panel"><p class="dashboard-eyebrow">CREATOR HUB</p><h1>Create a campaign</h1><p class="muted">Publish a YouTube engagement campaign with a clear action and reward.</p><form id="form"><div class="form-grid"><div class="field"><label>Campaign title</label><input id="title" maxlength="120" required placeholder="e.g. Watch my new YouTube video"></div><div class="field"><label>Reward (GH₵)</label><input id="reward" type="number" min="0.01" max="100" step="0.01" required placeholder="1.00"></div><div class="field"><label>Action</label><select id="action"><option value="watch">Watch</option><option value="like">Like</option><option value="subscribe">Subscribe</option></select></div><div class="field"><label>Platform</label><select disabled><option>YouTube</option></select></div><div class="field" style="grid-column:1/-1"><label>YouTube URL</label><input id="url" type="url" placeholder="https://youtube.com/watch?v=..." required></div></div><div style="margin-top:16px"><button class="primary-btn" type="submit">Publish campaign</button></div><div class="msg" id="msg"></div></form></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><p class="dashboard-eyebrow">LIVE CAMPAIGNS</p><h2>Available campaigns</h2></div><button class="secondary-btn" id="refresh">Refresh</button></div><div class="campaigns" id="campaigns"><p class="muted">Loading campaigns…</p></div></div></div></main><script>const token=localStorage.getItem('vsbil_access_token');if(!token)location.replace('/login.html');const $=id=>document.getElementById(id),headers=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});const money=v=>'₵'+(Number(v||0)/100).toFixed(2);async function load(){const r=await fetch('/api/activities',{headers:headers(),credentials:'include'}),d=await r.json();if(!r.ok||!d.success){$('campaigns').innerHTML='<p class="muted">Unable to load campaigns.</p>';return}if(!d.activities.length){$('campaigns').innerHTML='<p class="muted">No active campaigns yet.</p>';return}$('campaigns').innerHTML=d.activities.map(a=>`<article class="campaign"><h3>${String(a.title).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</h3><div class="meta"><span>${a.action}</span><span>Reward ${money(a.reward_amount)}</span></div><p class="muted">${String(a.url).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</p><a class="primary-btn" href="${encodeURI(a.url)}" target="_blank" rel="noopener">Open YouTube</a></article>`).join('')}$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Publishing…';const r=await fetch('/api/activities',{method:'POST',headers:headers(),credentials:'include',body:JSON.stringify({title:$('title').value,url:$('url').value,action:$('action').value,rewardGhs:Number($('reward').value)})}),d=await r.json();$('msg').textContent=d.message||(d.success?'Campaign published.':'Unable to publish campaign.');if(d.success){e.target.reset();load()}});$('refresh').onclick=load;load();</script></body></html>
