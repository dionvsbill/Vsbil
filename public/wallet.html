<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="VSBIL wallet, earnings and withdrawal management."><title>VSBIL Wallet</title><link rel="stylesheet" href="/css/style.css"><style>.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:18px;border:1px solid rgba(0,0,0,.08);border-radius:16px;background:#fff;margin:12px 0}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input,.field select{padding:12px;border:1px solid rgba(0,0,0,.15);border-radius:10px}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#f4f6fa}.status{font-weight:700}@media(max-width:720px){.wallet-grid{grid-template-columns:1fr}}</style></head><body><main class="legal-page"><a href="/dashboard.html">← Dashboard</a><h1>Wallet</h1><p id="walletMessage"></p><div id="walletSummary"></div><div class="wallet-grid"><section class="card"><h2 id="withdraw">Request withdrawal</h2><p class="notice">Minimum withdrawal is ₵20.00. Requests are reviewed before payout.</p><form id="withdrawForm"><label class="field">Amount (GHS)<input id="withdrawAmount" type="number" min="20" step="0.01" required></label><label class="field">Method<select id="withdrawMethod"><option value="mobile_money">Mobile money</option><option value="bank">Bank</option></select></label><div id="mobileFields"><label class="field">Mobile money number<input id="withdrawPhone" inputmode="tel" placeholder="0241234567"></label><label class="field">Provider (optional)<input id="withdrawProvider" placeholder="MTN"></label></div><div id="bankFields" class="hidden"><label class="field">Bank name<input id="bankName"></label><label class="field">Account name<input id="accountName"></label><label class="field">Account number<input id="accountNumber" inputmode="numeric"></label></div><button id="withdrawSubmit" type="submit">Submit withdrawal</button></form><div id="withdrawMessage" aria-live="polite"></div></section><section><h2>Withdrawal history</h2><div id="withdrawals"></div></section></div></main><script src="/js/auth-flow.js"></script><script src="/js/wallet.js"></script></body></html>
