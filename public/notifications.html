<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — VSBIL</title><link rel="stylesheet" href="/css/premium.css"></head><body><header class="topbar"><a class="brand" href="/"><img src="/assets/vsbil-logo.svg"><span>VSBIL</span></a><div class="top-search"><input placeholder="Search notifications"></div><div class="top-actions"><a class="avatar" href="/profile.html">U</a></div></header><div class="shell"><aside class="sidebar"><nav class="nav"><div class="nav-links"><a href="/"><b>⌂</b>Home</a><a href="/discover.html"><b>◎</b>Discover</a><a href="/dashboard.html"><b>▦</b>Dashboard</a><a href="/profile.html"><b>●</b>Profile</a><a href="/creator.html"><b>◈</b>Campaigns</a><a href="/shop.html"><b>◇</b>Shop</a><a href="/business.html"><b>▤</b>Business</a><a href="/whatsapp-bot.html"><b>◉</b>WhatsApp</a><a href="/messages.html"><b>✉</b>Messages</a><a class="active" href="/notifications.html"><b>♢</b>Notifications</a><a href="/settings.html"><b>⚙</b>Settings</a></div></nav></aside><main><section class="card section"><p class="eyebrow">UPDATES</p><div class="section-head"><div><h1>Notifications</h1><p class="muted">Campaign updates, social activity, shop activity and account alerts.</p></div><button class="btn" onclick="markAll()">Mark all read</button></div></section><section class="card section"><div class="feed-tabs"><button class="active" onclick="filter('all',this)">All</button><button onclick="filter('campaign',this)">Campaigns</button><button onclick="filter('shop',this)">Shop</button><button onclick="filter('system',this)">System</button></div><div id="list" class="list"><div class="list-row"><span class="muted">Loading updates…</span></div></div></section></main></div><script>const token=()=>localStorage.getItem('vsbil_access_token')||'';let data=[];async function load(){if(!token())return location.href='/login.html';try{const r=await fetch('/api/notifications',{headers:{Authorization:'Bearer '+token(),Accept:'application/json'},credentials:'include'});const d=await r.json();data=d.notifications||d.data||[];render('all')}catch{document.getElementById('list').innerHTML='<div class="list-row"><span class="muted">No new updates.</span></div>'}}function render(k){const a=k==='all'?data:data.filter(x=>(x.type||x.category||'system').toLowerCase().includes(k));document.getElementById('list').innerHTML=a.length?a.map(n=>`<div class="list-row"><div><strong>${String(n.title||'Update')}</strong><div class="muted">${String(n.message||'You have a new VSBIL update.')}</div></div><span class="muted">${n.created_at?new Date(n.created_at).toLocaleDateString():''}</span></div>`).join(''):'<div class="list-row"><span class="muted">Nothing here yet.</span></div>'}function filter(k,b){document.querySelectorAll('.feed-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(k)}function markAll(){alert('Notifications marked as read.')}load()</script></body></html>
