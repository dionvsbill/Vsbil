<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#070a12">

  <title>Create Account — Vsbil</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <a href="/" class="auth-logo">
      Vsbil
    </a>

    <section class="auth-card">

      <div class="auth-header">

        <p class="eyebrow">
          JOIN VSBIL
        </p>

        <h1>
          Create your account.
        </h1>

        <p>
          Join Vsbil and discover eligible campaigns,
          rewards and creator opportunities.
        </p>

      </div>


      <form id="registerForm">

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Choose a username"
            minlength="3"
            maxlength="30"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Create a strong password"
              minlength="8"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
            >
              Show
            </button>

          </div>

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Enter your password again"
            minlength="8"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="form-group">

          <label for="referralCode">
            Referral code
            <span>Optional</span>
          </label>

          <input
            id="referralCode"
            name="referralCode"
            type="text"
            placeholder="Enter referral code"
            maxlength="30"
            autocomplete="off"
          >

        </div>


        <div
          id="registerMessage"
          class="form-message"
          role="alert"
        ></div>


        <button
          type="submit"
          class="primary-btn auth-submit"
          id="registerBtn"
        >
          Create Account
        </button>


        <p class="auth-terms">
          By creating an account, you agree to our
          <a href="#">Terms</a> and
          <a href="#">Privacy Policy</a>.
        </p>

      </form>


      <div class="auth-divider">
        <span>Already have an account?</span>
      </div>


      <button
        type="button"
        class="secondary-btn auth-login"
        id="authLoginBtn"
      >
        Login
      </button>

    </section>

  </main>


  <script src="/js/register.js"></script>

</body>
</html>
