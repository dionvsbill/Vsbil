<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Magic link — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-container"><a class="auth-logo" href="/">Vsbil</a><section class="auth-card"><div class="auth-header"><p class="eyebrow">PASSWORDLESS SIGN-IN</p><h1>Use a magic link.</h1><p>Enter your VSBIL email and we'll send a one-time sign-in link. Never forward that link to another person.</p></div><form id="magicForm"><div class="form-group"><label>Email address</label><input id="email" type="email" autocomplete="email" required></div><div id="message" class="form-message" aria-live="polite"></div><button class="primary-btn auth-submit" id="submit">Send secure link</button></form><p class="auth-terms">For your security, we use the same response whether or not an account exists for the address.</p><div class="auth-divider"><span>Prefer your password?</span></div><button class="secondary-btn auth-login" type="button" onclick="location.href='/login.html'">Back to Login</button></section></main><script src="/js/auth-flow.js"></script><script>const f=document.getElementById('magicForm'),m=document.getElementById('message'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Sending…';try{const d=await VSBIL_AUTH.request('/api/auth/production/magic-link',{email:document.getElementById('email').value.trim().toLowerCase()});VSBIL_AUTH.message(m,d.message,'success');}catch(x){VSBIL_AUTH.message(m,x.message,'error')}finally{b.disabled=false;b.textContent='Send secure link'}});</script></body></html>
