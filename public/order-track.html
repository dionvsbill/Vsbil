<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track a VSBIL shop order"><title>Track Order — VSBIL</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/commerce.css"></head><body><main class="commerce-shell narrow"><header class="commerce-top"><a class="commerce-brand" href="/"><img src="/assets/vsbil-logo.svg" alt="VSBIL"></a><div><p class="eyebrow">ORDER TRACKING</p><h1>Track your delivery</h1></div></header><section class="commerce-card"><form id="trackForm" class="track-form"><input name="orderNumber" placeholder="Order number e.g. VSBIL-2026-ABC123" required><input name="phone" placeholder="Buyer phone number" required><button class="primary">Track order</button></form><div id="trackMessage" class="notice" hidden></div><div id="orderResult" hidden><div class="order-summary"><strong id="trackStatus"></strong><span id="trackTotal"></span></div><div id="trackItems"></div><div id="timeline" class="timeline"></div></div></section></main><script src="/js/order-track.js" defer></script></body></html>
