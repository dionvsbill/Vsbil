<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile — VSBIL</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css">
<style>
.profile-page{background:#070a12;color:#f7f8fc}.profile-wrap{max-width:980px;margin:auto;padding:26px 16px 70px}.profile-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.profile-nav a{color:#c8cfe0;text-decoration:none}.profile-cover{height:230px;border-radius:24px 24px 0 0;background:linear-gradient(120deg,#171d32,#0c1424);border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;background-size:cover;background-position:center}.profile-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(7,10,18,.55))}.profile-main{background:#101827;border:1px solid rgba(255,255,255,.08);border-top:0;border-radius:0 0 24px 24px;padding:0 24px 24px}.profile-head{display:flex;align-items:flex-end;gap:18px;position:relative;margin-top:-55px;z-index:2}.avatar-wrap{position:relative}.profile-avatar{width:118px;height:118px;border-radius:50%;border:5px solid #101827;background:#202b40;display:grid;place-items:center;overflow:hidden;font-size:38px;font-weight:900}.profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-title{padding-bottom:10px}.profile-title h1{margin:0;font-size:30px}.profile-handle{color:#9ba7ba;margin:5px 0 0}.profile-stats{display:flex;gap:24px;margin:20px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);padding:15px 0}.profile-stat strong{display:block;font-size:18px}.profile-stat span{font-size:12px;color:#9ba7ba}.profile-bio{color:#c6cede;line-height:1.6;max-width:700px}.profile-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.profile-btn{border-radius:11px;padding:11px 15px;font-weight:800;border:1px solid rgba(255,255,255,.12);background:#182237;color:#fff;cursor:pointer}.profile-btn.primary{background:#7568ff;border-color:#7568ff}.profile-btn input{display:none}.timeline{margin-top:18px}.timeline-card{background:#101827;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px;margin-bottom:14px}.timeline-card h2{margin:0 0 12px}.post-composer textarea{width:100%;box-sizing:border-box;min-height:100px;background:#0b1220;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:13px;resize:vertical}.post-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.post-tools input[type=file]{max-width:220px;color:#aeb7c9}.post{padding:17px 0;border-top:1px solid rgba(255,255,255,.07)}.post:first-child{border-top:0}.post-head{display:flex;gap:10px;align-items:center}.post-avatar{width:40px;height:40px;border-radius:50%;background:#202b40;display:grid;place-items:center;font-weight:800;overflow:hidden}.post-avatar img{width:100%;height:100%;object-fit:cover}.post-body{color:#d8deea;line-height:1.6;margin:12px 0}.post-media{max-width:100%;max-height:520px;border-radius:14px;display:block}.muted{color:#9ba7ba}.message{min-height:22px;color:#aeb8ca;margin-top:8px}.danger{color:#ff9b9b}@media(max-width:650px){.profile-cover{height:170px}.profile-head{align-items:flex-start;flex-direction:column;margin-top:-48px}.profile-avatar{width:96px;height:96px}.profile-main{padding:0 16px 20px}.profile-title{padding:0}.profile-stats{gap:16px}.post-tools{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body class="profile-page dashboard-page">
<main class="dashboard-main"><div class="profile-wrap">
<nav class="profile-nav"><a href="/dashboard.html">← Home</a><a href="/settings.html">Settings</a></nav>
<section class="profile-cover" id="cover"></section>
<section class="profile-main">
<div class="profile-head"><div class="avatar-wrap"><div class="profile-avatar" id="avatar">U</div></div><div class="profile-title"><h1 id="name">Loading…</h1><p class="profile-handle" id="handle"></p></div></div>
<div class="profile-stats"><div class="profile-stat"><strong id="followers">0</strong><span>Followers</span></div><div class="profile-stat"><strong id="following">0</strong><span>Following</span></div><div class="profile-stat"><strong id="postsCount">0</strong><span>Posts</span></div></div>
<p class="profile-bio" id="bio">Add a short introduction to your profile.</p>
<div class="profile-actions"><label class="profile-btn primary">Profile photo<input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label class="profile-btn">Cover photo<input id="coverInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><a class="profile-btn" href="/settings.html">Edit settings</a></div>
<div class="message" id="message"></div>
</section>
<section class="timeline">
<div class="timeline-card post-composer"><h2>Share an update</h2><textarea id="postBody" maxlength="5000" placeholder="What would you like to share?"></textarea><div class="post-tools"><input id="postMedia" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"><button class="profile-btn primary" id="postBtn" type="button">Publish</button></div><div class="message" id="postMessage"></div></div>
<div class="timeline-card"><h2>Timeline</h2><div id="timeline"><p class="muted">Loading posts…</p></div></div>
</section>
</div></main>
<script>
"use strict";
const token=()=>localStorage.getItem('vsbil_access_token')||'';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const headers=new Headers(opt.headers||{});headers.set('Accept','application/json');headers.set('Authorization','Bearer '+token());if(opt.body&&typeof opt.body==='string')headers.set('Content-Type','application/json');const r=await fetch(path,{...opt,headers,credentials:'include'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Unable to complete that request.');return d}
function fileData(file,max=6*1024*1024){return new Promise((resolve,reject)=>{if(!file||file.size>max)return reject(Error('Choose an image smaller than 6 MB.'));const reader=new FileReader();reader.onload=()=>resolve({dataUrl:String(reader.result),mediaType:file.type});reader.onerror=()=>reject(Error('Unable to read the selected image.'));reader.readAsDataURL(file)})}
async function loadProfile(){const d=await api('/api/users/profile');const u=d.user;$('name').textContent=u.username||'VSBIL User';$('handle').textContent='@'+(u.username||'user');$('bio').textContent=u.bio||'No introduction yet.';$('followers').textContent='—';$('following').textContent='—';if(u.avatar_url)$('avatar').innerHTML=`<img src="${esc(u.avatar_url)}" alt="">`;else $('avatar').textContent=(u.username||'U')[0].toUpperCase();if(u.cover_url)$('cover').style.backgroundImage=`url("${u.cover_url}")`;localStorage.setItem('vsbil_user',JSON.stringify(u));}
async function loadTimeline(){const d=await api('/api/social/feed?limit=30');const posts=d.posts||[];$('postsCount').textContent=String(posts.length);$('timeline').innerHTML=posts.length?posts.map(p=>`<article class="post"><div class="post-head"><div class="post-avatar">${esc((p.users?.username||'U')[0]).toUpperCase()}</div><div><strong>${esc(p.users?.username||'VSBIL User')}</strong><div class="muted">${new Date(p.created_at).toLocaleString()}</div></div></div>${p.body?`<div class="post-body">${esc(p.body)}</div>`:''}${p.media_url?`<img class="post-media" src="${esc(p.media_url)}" alt="Post media" loading="lazy">`:''}</article>`).join(''):'<p class="muted">Your timeline is waiting for your first post.</p>'}
async function upload(field,file){const payload=await fileData(file);const d=await api('/api/users/profile/media',{method:'POST',body:JSON.stringify({field,dataUrl:payload.dataUrl,mediaType:payload.mediaType})});return d}
$('avatarInput').onchange=async()=>{try{$('message').textContent='Uploading profile photo…';const d=await upload('avatar',$('avatarInput').files[0]);if(d.url)$('avatar').innerHTML=`<img src="${esc(d.url)}" alt="Profile photo">`;$('message').textContent='Profile photo updated.'}catch(e){$('message').textContent=e.message}};
$('coverInput').onchange=async()=>{try{$('message').textContent='Uploading cover photo…';const d=await upload('cover',$('coverInput').files[0]);if(d.url)$('cover').style.backgroundImage=`url("${d.url}")`;$('message').textContent='Cover photo updated.'}catch(e){$('message').textContent=e.message}};
$('postBtn').onclick=async()=>{try{const body=$('postBody').value.trim();const file=$('postMedia').files[0];if(!body&&!file)throw Error('Write something or choose media first.');$('postBtn').disabled=true;$('postMessage').textContent='Publishing…';let mediaUrl=null,mediaType=null;if(file){const p=await fileData(file);const d=await api('/api/social/upload',{method:'POST',body:JSON.stringify({dataUrl:p.dataUrl,mediaType:p.mediaType})});mediaUrl=d.url;mediaType=p.mediaType.split('/')[0]}await api('/api/social/posts',{method:'POST',body:JSON.stringify({body,mediaUrl,mediaType,visibility:'public'})});$('postBody').value='';$('postMedia').value='';$('postMessage').textContent='Posted.';await loadTimeline()}catch(e){$('postMessage').textContent=e.message}finally{$('postBtn').disabled=false}};
Promise.all([loadProfile(),loadTimeline()]).catch(e=>{$('message').textContent=e.message;if(/sign|session|token/i.test(e.message))setTimeout(()=>location.replace('/login.html'),900)});
</script>
</body></html>
