<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><style>.page{max-width:900px;margin:auto;padding:40px 20px}.panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:28px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px}label{font-weight:700;color:#c9cede}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0d1220;color:#fff;box-sizing:border-box}.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);font-size:30px;font-weight:800;margin-bottom:18px}.actions{display:flex;gap:12px;align-items:center;margin-top:20px}.back{color:#aeb7ce;text-decoration:none}.message{min-height:24px;color:#aeb7ce}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body class="dashboard-page"><main class="dashboard-main"><div class="page"><a class="back" href="/dashboard.html">← Back to dashboard</a><div class="panel"><div class="avatar" id="avatar">U</div><p class="dashboard-eyebrow">YOUR PROFILE</p><h1 id="name">Loading…</h1><p id="email"></p><form id="profileForm"><div class="grid"><div class="field"><label for="username">Username</label><input id="username" required minlength="3" maxlength="30"></div><div class="field"><label>Role</label><input id="role" disabled></div><div class="field"><label>Account status</label><input id="status" disabled></div><div class="field"><label>Referral code</label><input id="referral" disabled></div></div><div class="actions"><button class="primary-btn" type="submit">Save profile</button><span class="message" id="message"></span></div></form></div></div></main><script>const token=localStorage.getItem('vsbil_access_token');if(!token)location.replace('/login.html');const $=id=>document.getElementById(id);async function load(){const r=await fetch('/api/users/profile',{headers:{Authorization:'Bearer '+token},credentials:'include'});const d=await r.json();if(!r.ok||!d.success){$('message').textContent=d.message||'Unable to load profile';return}const u=d.user;$('name').textContent=u.username;$('email').textContent=u.email;$('username').value=u.username;$('role').value=u.role;$('status').value=u.status;$('referral').value=u.referral_code;$('avatar').textContent=(u.username||'U')[0].toUpperCase();localStorage.setItem('vsbil_user',JSON.stringify(u))}$('profileForm').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='Saving…';const r=await fetch('/api/users/profile',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value}),credentials:'include'});const d=await r.json();$('message').textContent=d.message||(d.success?'Profile saved.':'Unable to save.');if(d.success)load()});load();</script></body></html>
