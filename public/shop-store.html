<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="VSBIL Shop storefront"><title>VSBIL Shop</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/commerce.css"></head><body><main class="commerce-shell"><section class="commerce-hero"><a class="commerce-brand" href="/"><img src="/assets/vsbil-logo.svg" alt="VSBIL"></a><div><p class="eyebrow">VSBIL STOREFRONT</p><h1 id="shopName">Loading shop…</h1><p id="shopDescription"></p></div><div id="shopContact" class="commerce-contact"></div></section><section class="commerce-grid"><div><div class="section-head"><div><p class="eyebrow">PRODUCTS</p><h2>Shop products</h2></div><span id="cartCount">0 items</span></div><div id="products" class="product-grid"></div></div><aside class="commerce-card"><p class="eyebrow">YOUR ORDER</p><h2>Checkout</h2><div id="cart" class="cart-list"><p class="muted">Your cart is empty.</p></div><form id="checkoutForm"><input name="buyerName" placeholder="Full name" required maxlength="160"><input name="buyerPhone" placeholder="Phone number" required maxlength="40"><input name="buyerEmail" type="email" placeholder="Email (optional)"><textarea name="deliveryAddress" placeholder="Delivery address" maxlength="1000"></textarea><select name="paymentMethod"><option value="cash_on_delivery">Cash on delivery</option><option value="mobile_money">Mobile Money</option><option value="card">Card</option></select><button class="primary" type="submit">Place order</button></form><div id="checkoutMessage" class="notice" hidden></div></aside></section></main><script src="/js/shop-store.js" defer></script></body></html>
