<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="VSBIL Shop storefront"><title>VSBIL Shop</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/commerce.css"><style>.store-banner{width:100%;max-height:300px;object-fit:cover;border-radius:20px;margin-bottom:18px}.store-tools{display:flex;gap:10px;margin-bottom:16px}.store-tools input,.store-tools select{flex:1;padding:12px;border-radius:12px;border:1px solid #ccd4df;background:var(--card,#fff);color:inherit}</style></head><body><main class="commerce-shell"><section class="commerce-hero"><a class="commerce-brand" href="/"><img src="/assets/vsbil-logo.svg" alt="VSBIL"></a><div><p class="eyebrow">VSBIL STOREFRONT</p><h1 id="shopName">Loading shop…</h1><p id="shopDescription"></p></div><div id="shopContact" class="commerce-contact"></div></section><img id="shopBanner" class="store-banner" alt="Shop banner" hidden><section class="commerce-grid"><div><div class="section-head"><div><p class="eyebrow">PRODUCTS</p><h2>Shop products</h2></div><span id="cartCount">0 items</span></div><div class="store-tools"><input id="productSearch" type="search" placeholder="Search products" aria-label="Search products"><select id="categoryFilter" aria-label="Filter category"><option value="">All categories</option></select></div><div id="products" class="product-grid"></div></div><aside class="commerce-card"><p class="eyebrow">YOUR ORDER</p><h2>Checkout</h2><div id="cart" class="cart-list"><p class="muted">Your cart is empty.</p></div><form id="checkoutForm"><input name="buyerName" placeholder="Full name" required maxlength="160"><input name="buyerPhone" placeholder="Phone number" required maxlength="40"><input name="buyerEmail" type="email" placeholder="Email (optional)"><textarea name="deliveryAddress" placeholder="Delivery address" maxlength="1000"></textarea><select name="paymentMethod"><option value="cash_on_delivery">Cash on delivery</option><option value="mobile_money">Mobile Money</option><option value="card">Card</option></select><button class="primary" type="submit">Place order</button></form><div id="checkoutMessage" class="notice" hidden></div></aside></section></main><script src="/js/shop-store.js" defer></script></body></html>
