<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <title>Signing you in — VSBIL</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <a class="auth-logo" href="/">VSBIL</a>
    <section class="auth-card" aria-live="polite">
      <div class="auth-header">
        <p class="eyebrow">SECURE SIGN-IN</p>
        <h1 id="title">Finishing your sign-in.</h1>
        <p id="message">We're securely validating your Google session. Please keep this window open.</p>
      </div>
      <div id="details" class="form-message"></div>
    </section>
  </main>

  <script src="/js/auth-flow.js"></script>
  <script>
    "use strict";

    const message = document.getElementById("message");
    const title = document.getElementById("title");
    const details = document.getElementById("details");

    function redirectToLogin(reason) {
      const params = new URLSearchParams();
      params.set("oauth_error", reason || "signin_failed");
      window.location.replace("/login.html?" + params.toString());
    }

    function fail(text) {
      title.textContent = "Sign-in could not be completed.";
      message.textContent = text;
      details.textContent = "Returning to the login page…";
      details.className = "form-message error";
      window.setTimeout(() => redirectToLogin(text), 700);
    }

    function readOAuthResult() {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const error = query.get("error_description") || query.get("error") || hash.get("error_description") || hash.get("error");
      if (error) throw new Error(decodeURIComponent(error.replace(/\+/g, " ")));
      const accessToken = hash.get("access_token") || query.get("access_token");
      if (!accessToken) throw new Error("No authentication session was returned by Supabase.");
      return {
        accessToken,
        refreshToken: hash.get("refresh_token") || query.get("refresh_token") || null,
        expiresIn: hash.get("expires_in") || query.get("expires_in") || null,
        expiresAt: hash.get("expires_at") || query.get("expires_at") || null,
        tokenType: hash.get("token_type") || query.get("token_type") || "bearer"
      };
    }

    function readJwtMetadata(token) {
      try {
        const part = token.split(".")[1];
        if (!part) return {};
        const normalized = part.replace(/-/g, "+").replace(/_/g, "/");
        const json = decodeURIComponent(atob(normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, "=")).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
        const payload = JSON.parse(json);
        return payload.user_metadata || {};
      } catch {
        return {};
      }
    }

    (async () => {
      try {
        const session = readOAuthResult();
        message.textContent = "Validating your VSBIL account…";

        const data = await VSBIL_AUTH.request("/api/auth/production/session", {
          accessToken: session.accessToken
        });

        if (!data?.user) throw new Error("VSBIL profile not found.");

        const google = readJwtMetadata(session.accessToken);
        const user = {
          ...data.user,
          avatarUrl: data.user.avatarUrl || data.user.avatar_url || google.avatar_url || google.picture || google.photo_url || null,
          displayName: data.user.displayName || data.user.display_name || google.full_name || google.name || null,
          googleEmail: google.email || null
        };

        VSBIL_AUTH.saveSession(session, user);
        history.replaceState({}, document.title, "/auth-callback.html");

        title.textContent = "You're signed in.";
        message.textContent = `Welcome back, ${user.username || user.displayName || "VSBIL user"}. Opening your dashboard…`;
        details.textContent = "";
        details.className = "form-message success";
        window.setTimeout(() => window.location.replace("/dashboard.html"), 450);
      } catch (error) {
        console.error("VSBIL OAuth callback failed", error);
        try { VSBIL_AUTH.clearSession(); } catch {}
        fail(error instanceof Error ? error.message : "Unable to complete sign-in.");
      }
    })();
  </script>
</body>
</html>
