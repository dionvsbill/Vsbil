<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Signing you in — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-container"><a class="auth-logo" href="/">Vsbil</a><section class="auth-card"><div class="auth-header"><p class="eyebrow">SECURE SIGN-IN</p><h1>Finishing your sign-in.</h1><p id="message">We're securely validating your Google session. Please keep this window open.</p></div></section></main><script src="/js/auth-flow.js"></script><script>const m=document.getElementById('message');(async()=>{try{const hash=new URLSearchParams(location.hash.replace(/^#/,'')).get('access_token');const query=new URLSearchParams(location.search);if(!hash){throw new Error(query.get('error_description')||'No authentication session was returned.');}const d=await VSBIL_AUTH.request('/api/auth/production/session',{accessToken:hash});VSBIL_AUTH.saveSession({accessToken:hash},d.user);history.replaceState({},document.title,location.pathname);m.textContent='Signed in successfully. Opening your dashboard…';setTimeout(()=>location.replace('/dashboard.html'),500);}catch(e){m.textContent=e.message+' You can return to the login page and try again.';}})();</script></body></html>
