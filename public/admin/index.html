<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a12"><meta name="description" content="VSBIL secure administration and operations console"><title>VSBIL Admin Control Center</title><link rel="stylesheet" href="/css/admin.css?v=20260902-4"><link rel="preconnect" href="https://cdn.jsdelivr.net"><style>:root{--admin-bg:#070a12;--admin-panel:#0d1220;--admin-border:rgba(255,255,255,.09);--admin-muted:#8d98ad}body{background:var(--admin-bg)}.admin-top{display:flex;gap:12px;align-items:center}.live-dot{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#86efac}.live-dot i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.12);animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.4}}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{background:#0b1020;color:inherit;border:1px solid var(--admin-border);border-radius:9px;padding:10px 12px}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.metric{padding:16px;border:1px solid var(--admin-border);border-radius:12px;background:linear-gradient(145deg,#111827,#0b1020)}.metric small{display:block;color:var(--admin-muted)}.metric strong{display:block;font-size:24px;margin-top:6px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid var(--admin-border)}.verified{color:#7dd3fc;border-color:rgba(56,189,248,.3)}.danger{color:#fda4af}.user-intel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.intel-card{border:1px solid var(--admin-border);background:#0b1020;border-radius:12px;padding:14px}.intel-card h3{margin:0 0 8px;font-size:14px}.muted{color:var(--admin-muted)}.flag{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--admin-border)}.flag:last-child{border-bottom:0}.switch{position:relative;width:44px;height:24px;display:inline-block}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#374151;cursor:pointer}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#16a34a}.switch input:checked+.slider:before{transform:translateX(20px)}.activity-feed{display:grid;gap:8px}.feed-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--admin-border)}@media(max-width:760px){aside{position:relative!important;width:auto!important;height:auto!important}.admin-top{align-items:flex-start}.feed-item{display:block}.feed-item time{display:block;margin-top:4px}}</style></head><body><aside><a class="brand" href="/">VSBIL <small>OPERATIONS</small></a><div class="admin-mobile-bar"><span>ADMIN CONSOLE</span><button id="navToggle" type="button">Menu</button></div><nav><button data-view="overview">Overview</button><button data-view="live">Live Operations</button><button data-view="users">Users</button><button data-view="verification">Verification</button><button data-view="payments">Payments</button><button data-view="withdrawals">Withdrawals</button><button data-view="campaigns">Campaigns</button><button data-view="submissions">Submissions</button><button data-view="referrals">Referrals</button><button data-view="ledger">Transaction Ledger</button><button data-view="announcements">Announcements</button><button data-view="features">Feature Controls</button><button data-view="settings">System Settings</button><button data-view="audit">Audit Logs</button><a href="/admin/import/jumia" class="admin-link">Jumia Product Importer</a></nav><a href="/dashboard.html">← User dashboard</a></aside><main><header><div><p>ADMINISTRATION</p><h1 id="title">Command Center</h1></div><div class="admin-top"><span class="live-dot"><i></i> LIVE</span><button id="refresh">Refresh</button></div></header><div id="content"><div class="loading">Loading secure console…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/admin-control.js?v=20260902-2"></script><script src="/js/admin-experience.js?v=20260902-1"></script><script>document.getElementById('navToggle')?.addEventListener('click',()=>document.body.classList.toggle('admin-nav-open'));</script></body></html>
