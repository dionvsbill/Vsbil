<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Reset password — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-container"><a class="auth-logo" href="/">Vsbil</a><section class="auth-card"><div class="auth-header"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password.</h1><p>Request a short-lived code, then choose a new password. Existing sessions should be treated as untrusted after a password reset.</p></div><form id="requestForm"><div class="form-group"><label>Email address</label><input id="email" type="email" autocomplete="email" required></div><div id="message" class="form-message"></div><button class="primary-btn auth-submit" id="requestBtn">Send reset code</button></form><form id="confirmForm" hidden><div class="form-group"><label>Reset code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div><div class="form-group"><label>New password</label><input id="password" type="password" autocomplete="new-password" required></div><div class="form-group"><label>Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" required></div><button class="primary-btn auth-submit" id="confirmBtn">Change password</button></form><div class="auth-divider"><span>Remembered it?</span></div><button class="secondary-btn auth-login" type="button" onclick="location.href='/login.html'">Back to Login</button></section></main><script src="/js/auth-flow.js"></script><script>const rq=document.getElementById('requestForm'),cf=document.getElementById('confirmForm'),m=document.getElementById('message'),email=document.getElementById('email'),rb=document.getElementById('requestBtn'),cb=document.getElementById('confirmBtn');rq.addEventListener('submit',async e=>{e.preventDefault();rb.disabled=true;try{const d=await VSBIL_AUTH.request('/api/auth/production/password-reset/request',{email:email.value.trim().toLowerCase()});VSBIL_AUTH.message(m,d.message,'success');cf.hidden=false;}catch(x){VSBIL_AUTH.message(m,x.message,'error')}finally{rb.disabled=false}});cf.addEventListener('submit',async e=>{e.preventDefault();cb.disabled=true;try{const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value)throw new Error('Passwords do not match.');const d=await VSBIL_AUTH.request('/api/auth/production/password-reset/confirm',{email:email.value.trim().toLowerCase(),code:document.getElementById('code').value,password:p});VSBIL_AUTH.message(m,d.message,'success');cf.reset();setTimeout(()=>location.href='/login.html',900);}catch(x){VSBIL_AUTH.message(m,x.message,'error')}finally{cb.disabled=false}});</script></body></html>
