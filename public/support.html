<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSBIL Support & Reports</title></head><body class="social-page"><main class="social-wrap"><div class="social-card"><a href="/social.html">← Community</a><p class="social-muted">TRUST & SAFETY</p><h1>Support & Report</h1><p>File a complaint about a fake shop, an order, a user, unsafe content, copyright, payment or another problem. Your ticket is private to you and VSBIL support.</p><form id="complaint" class="complaint-form"><select name="category" required><option value="fake_shop">Fake shop</option><option value="counterfeit">Counterfeit item</option><option value="fraud">Fraud</option><option value="item_not_received">Item not received</option><option value="item_not_as_described">Item not as described</option><option value="abuse">Abusive user</option><option value="spam">Spam</option><option value="copyright">Copyright</option><option value="sexual_content">Unsafe sexual content</option><option value="privacy">Privacy</option><option value="payment">Payment</option><option value="other">Other</option></select><input name="subject" maxlength="200" placeholder="Subject" required><textarea name="description" rows="8" maxlength="5000" placeholder="Explain what happened. Include order/shop/post details where relevant." required></textarea><input name="shopId" placeholder="Shop ID (optional)"><input name="orderId" placeholder="Order ID (optional)"><input name="targetUserId" placeholder="User ID (optional)"><button class="social-btn primary" type="submit">Submit confidential report</button><p id="message" class="social-muted"></p></form></div></main><script src="/js/social.js" defer></script><script>document.getElementById('complaint').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('message');const b=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/social/complaints',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${localStorage.getItem('vsbil_access_token')||''}`},body:JSON.stringify(b)});const d=await r.json();m.textContent=d.message||'Report submitted';if(r.ok)f.reset()}catch(err){m.textContent='Unable to submit report'}});</script></body></html>
