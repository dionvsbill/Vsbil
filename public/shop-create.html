<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Create Shop — VSBIL</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/commerce.css"></head>
<body><main class="commerce-shell"><header class="commerce-top"><a class="commerce-brand" href="/business.html"><img src="/assets/vsbil-logo.svg" alt="VSBIL"></a><div><p class="eyebrow">VSBIL SHOP</p><h1>Create your storefront</h1></div><a class="secondary" href="/business.html">Back</a></header>
<section class="commerce-card shop-create-card"><p class="eyebrow">START SELLING</p><h2>Your shop details</h2><p class="muted">Create the storefront first. You can add products, JForce settings and WhatsApp automation from the shop control center.</p>
<form id="createShop" class="form-grid"><input name="name" placeholder="Shop name" required maxlength="120"><input name="storeSlug" placeholder="Store URL slug (optional)" maxlength="70"><textarea name="description" placeholder="What does your shop sell?" maxlength="2000"></textarea><input name="phone" placeholder="Business phone" maxlength="40"><input name="momoNumber" placeholder="MoMo number for shop settings" maxlength="40"><input name="deliveryFee" type="number" min="0" step="0.01" placeholder="Default delivery fee (GHS)"><input name="jforceId" placeholder="JForce ID (optional)" maxlength="100"><button class="primary" type="submit">Create shop</button></form><div id="message" class="notice" hidden></div></section></main><script src="/js/shop-create.js" defer></script></body></html>
