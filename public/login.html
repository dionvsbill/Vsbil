<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070a12"
  >

  <meta
    name="description"
    content="Login to your Vsbil account."
  >

  <title>Login — Vsbil</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <a href="/" class="auth-logo">
      Vsbil
    </a>

    <section class="auth-card">

      <div class="auth-header">

        <p class="eyebrow">
          WELCOME BACK
        </p>

        <h1>
          Login to Vsbil.
        </h1>

        <p>
          Sign in to manage your account,
          discover campaigns and track your rewards.
        </p>

      </div>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
            >
              Show
            </button>

          </div>

        </div>

        <div
          id="loginMessage"
          class="form-message"
          role="alert"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          class="primary-btn auth-submit"
          id="loginBtn"
        >
          Login
        </button>

        <p class="auth-terms">
          By continuing, you agree to our
          <a href="/terms.html">Terms</a> and
          <a href="/privacy.html">Privacy Policy</a>.
        </p>

      </form>

      <div class="auth-divider">
        <span>Don't have an account?</span>
      </div>

      <button
        type="button"
        class="secondary-btn auth-login"
        id="registerBtn"
      >
        Create Account
      </button>

    </section>

  </main>

  <script src="/js/login.js"></script>

</body>
</html>
