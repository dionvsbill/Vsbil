<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#070a12"><meta name="description" content="Securely sign in to your Vsbil account."><title>Login — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-container"><a href="/" class="auth-logo">Vsbil</a><section class="auth-card"><div class="auth-header"><p class="eyebrow">WELCOME BACK</p><h1>Login to Vsbil.</h1><p>Secure access to your campaigns, verified activities, wallet and account controls.</p></div><button type="button" class="secondary-btn auth-login" id="googleBtn">Continue with Google</button><div class="auth-divider"><span>or use your email</span></div><form id="loginForm"><div class="form-group"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" id="passwordToggle">Show</button></div></div><div id="loginMessage" class="form-message" role="alert" aria-live="polite"></div><button type="submit" class="primary-btn auth-submit" id="loginBtn">Login</button></form><div class="auth-actions"><a href="/magic-link.html">Sign in with a magic link</a><a href="/reset-password.html">Forgot password?</a></div><p class="auth-terms">By continuing, you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p><div class="auth-divider"><span>New to Vsbil?</span></div><button type="button" class="secondary-btn auth-login" id="registerBtn">Create Account</button></section></main><script src="/js/auth-flow.js"></script><script src="/js/login.js"></script><script>document.getElementById('googleBtn')?.addEventListener('click',async()=>{const b=document.getElementById('googleBtn');b.disabled=true;b.textContent='Connecting…';try{const d=await VSBIL_AUTH.request('/api/auth/production/google');location.href=d.url;}catch(e){document.getElementById('loginMessage').textContent=e.message;b.disabled=false;b.textContent='Continue with Google';}});</script></body></html>
