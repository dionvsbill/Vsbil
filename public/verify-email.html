<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><title>Verify email — Vsbil</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body class="auth-page"><main class="auth-container"><a href="/" class="auth-logo">Vsbil</a><section class="auth-card"><div class="auth-header"><p class="eyebrow">SECURE YOUR ACCOUNT</p><h1>Confirm your email.</h1><p>We sent a six-digit verification code to your email. Confirming it protects your account and helps keep VSBIL genuine.</p></div><form id="verifyForm"><div class="form-group"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></div><div id="message" class="form-message" aria-live="polite"></div><button class="primary-btn auth-submit" id="verifyBtn">Verify email</button></form><div class="auth-divider"><span>Didn't receive it?</span></div><button class="secondary-btn auth-login" id="resendBtn" type="button">Resend code</button><p class="auth-terms">Codes expire after 10 minutes. Never share a verification code with anyone.</p></section></main><script src="/js/auth-flow.js"></script><script src="/js/verify-email.js"></script></body></html>
